name: Lean reproduction
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned sources
        run: python3 scripts/setup.py
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: stable_matching
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"
      - name: Get Mathlib cache
        working-directory: stable_matching
        run: lake exe cache get
      - name: Build Solution
        working-directory: anthropic_bridge
        run: lake --fail-fast build +Solution:olean
      - name: Build matching proof
        working-directory: stable_matching
        run: lake --fail-fast build +StableMatching:olean
